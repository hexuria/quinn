[package]
name = "quinn"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Leptos-style components rendered by Makepad"

[features]
default = ["native"]
native = ["dep:quinn-makepad"]

[dependencies]
quinn-core = { path = "../core" }
quinn-styles = { path = "../styles" }
quinn-reactive = { path = "../reactive" }
quinn-macros = { path = "../macros" }
quinn-makepad = { path = "../makepad", optional = true }
