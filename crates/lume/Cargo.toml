[package]
name = "lume"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Leptos-style components rendered by Makepad"

[features]
default = ["native"]
native = ["dep:lm-makepad"]

[dependencies]
lm-core = { path = "../core" }
lm-styles = { path = "../styles" }
lm-reactive = { path = "../reactive" }
lm-macros = { path = "../macros" }
lm-makepad = { path = "../makepad", optional = true }
