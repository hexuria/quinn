name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: "1.99.0"
      - name: Unit tests without the Makepad renderer
        run: cargo test -p lm-styles -p lm-reactive -p lm-core -p lume --no-default-features
