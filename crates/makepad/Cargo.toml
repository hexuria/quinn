[package]
name = "quinn-makepad"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Makepad surface: the only renderer"

[dependencies]
quinn-core = { path = "../core" }
quinn-styles = { path = "../styles" }
quinn-lower = { path = "../lower" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
makepad-widgets = { git = "https://github.com/makepad/makepad", branch = "work", default-features = false }
